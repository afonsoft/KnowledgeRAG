# EF migrations are dotnet-ef scaffold output — the SQLite/Postgres twin
# files look like duplication to the new-code duplication gate.
sonar.cpd.exclusions=**/Migrations/**

# archify generated docs — same exclusion as code-quality.yml /d:sonar.exclusions;
# AutoScan ignores /d: params and only honors this file.
sonar.exclusions=docs/architecture/**/*.html

# agent-harness skills catalog (tooling content, not product code) — the store
# `skills/` and its installed copy `.claude/skills/` are the same files twice,
# which breaks the new-code duplication gate; shell installers break security rating.
sonar.exclusions=docs/architecture/**/*.html,.claude/skills/**,skills/**
