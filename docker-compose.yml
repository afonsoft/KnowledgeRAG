# docker-compose.yml — KnowledgeHub (SPEC-20260913-install-deploy RF-007)
# Same result as `./install.sh --docker`, declared declaratively.
services:
  knowledgerag:
    # The local build tags itself as the published image — so a host without
    # the repo can skip the build entirely: `docker compose pull && up -d`
    # (or just remove the `build:` line) pulls the released image.
    build: .
    image: ghcr.io/afonsoft/knowledgerag:latest
    container_name: knowledgerag
    # Vars in .env reach the container directly (ASP.NET Core reads
    # `Section__Key` env names case-insensitively) — same pattern as
    # proxyLLM-AI. `required: false` keeps clean checkouts deployable
    # without a .env; compose still interpolates ${VARS} below from it.
    env_file:
      - path: .env
        required: false
    ports:
      - "${KNOWLEDGEHUB_PORT:-5000}:8080"
    volumes:
      - ./data:/data
      # Default Obsidian vault — named volume initialized from the image's
      # /vaults/default (uid 1654 already correct, unlike bind mounts). The
      # first-boot seeder registers an ObsidianVault source at Vault__Path so
      # write_note/write_knowledge/read_document work out of the box. Prefer a
      # host path? Replace with a bind mount (and chown 1654:1654), or move it
      # to docker-compose.override.yml.
      - vault:/vaults/default
      # SPEC-20260925-log-sinks-and-redaction RF-001: Serilog file sink writes
      # /app/logs — persist it on the host so logs survive recreate/upgrade.
      # NOTE: if ./logs doesn't exist Docker creates it as root, but the
      # container runs as app (uid 1654) and the file sink can't write.
      # Pre-create it: `mkdir -p logs && chown 1654:1654 logs`.
      - ./logs:/app/logs
      # Host-specific mounts (local Obsidian vaults, WebDAV) go in
      # docker-compose.override.yml — see docker-compose.override.yml.example.
      # Obsidian via WebDAV (SPEC-20260914-obsidian-webdav RF-006): mount the
      # remote on the HOST (davfs2/rclone — see README "Obsidian via WebDAV")
      # and bind it read-only into the container. The container path is what
      # goes in the source's configuration.path (e.g. /vaults/obsidian).
      #   - /srv/webdav/obsidian:/vaults/obsidian:ro
    environment:
      # Kestrel AllowedHosts — appsettings pins localhost only; behind a reverse
      # proxy/tunnel the public hostname must be allowed (or use * since the
      # tunnel is the trust boundary). Override via .env ALLOWED_HOSTS.
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      Embeddings__Provider: ${EMBEDDINGS_PROVIDER:-deterministic}
      Embeddings__Endpoint: ${EMBEDDINGS_ENDPOINT:-http://host.docker.internal:11434}
      Embeddings__ApiKey: ${EMBEDDINGS_APIKEY:-}
      Embeddings__Model: ${EMBEDDINGS_MODEL:-nomic-embed-text}
      # SPEC-20260926-unified-database-provider: one backend for catalog + vector
      # store. DATABASE_PROVIDER=auto probes the POSTGRES_* target and falls
      # back to SQLite when unreachable; postgres|sqlite force the choice.
      # An explicit VECTORSTORE_PROVIDER stays an override for mixed mode.
      Database__Provider: ${DATABASE_PROVIDER:-auto}
      # Leave empty — the app composes from POSTGRES_* (env_file) unless an
      # explicit DATABASE_CONNECTIONSTRING escape hatch is set in .env.
      Database__ConnectionString: ${DATABASE_CONNECTIONSTRING:-}
      VectorStore__Provider: ${VECTORSTORE_PROVIDER:-}
      # proxyLLM-AI pattern: the connection string is composed from discrete
      # POSTGRES_* vars in .env (host Postgres is reached via the
      # host.docker.internal extra_hosts mapping below — make sure the
      # container's subnet is allowed in the host's pg_hba.conf).
      # VECTORSTORE_CONNECTIONSTRING, when set, wins over the composition.
      VectorStore__ConnectionString: ${VECTORSTORE_CONNECTIONSTRING:-Host=${POSTGRES_HOST:-host.docker.internal};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-rag_db};Username=${POSTGRES_USER:-rag_user};Password=${POSTGRES_PASSWORD:-}}
      DeepWiki__Enabled: ${DEEPWIKI_ENABLED:-true}
      DeepWiki__Endpoint: ${DEEPWIKI_ENDPOINT:-https://mcp.deepwiki.com/mcp}
      DeepWiki__PrivateEndpoint: ${DEEPWIKI_PRIVATE_ENDPOINT:-https://mcp.devin.ai/mcp}
      DeepWiki__ApiKey: ${DEEPWIKI_APIKEY:-}
      Firecrawl__Enabled: ${FIRECRAWL_ENABLED:-true}
      Firecrawl__Endpoint: ${FIRECRAWL_ENDPOINT:-https://mcp.firecrawl.dev/v2/mcp}
      Firecrawl__ApiKey: ${FIRECRAWL_APIKEY:-}
      Firecrawl__TimeoutSeconds: ${FIRECRAWL_TIMEOUT_SECONDS:-300}
      Tavily__Enabled: ${TAVILY_ENABLED:-true}
      Tavily__Endpoint: ${TAVILY_ENDPOINT:-https://mcp.tavily.com/mcp}
      Tavily__ApiKey: ${TAVILY_APIKEY:-}
      Tavily__TimeoutSeconds: ${TAVILY_TIMEOUT_SECONDS:-120}
      Context7__Enabled: ${CONTEXT7_ENABLED:-true}
      Context7__Endpoint: ${CONTEXT7_ENDPOINT:-https://mcp.context7.com/mcp}
      Context7__ApiKey: ${CONTEXT7_APIKEY:-}
      Context7__TimeoutSeconds: ${CONTEXT7_TIMEOUT_SECONDS:-60}
      # SPEC-20260916-performance-memory-cache RF-005: IDistributedCache —
      # memory (default, zero-infra) | redis (host Redis via host-gateway).
      Cache__Provider: ${CACHE_PROVIDER:-memory}
      Cache__Redis__ConnectionString: ${REDIS_CONNECTIONSTRING:-}
      # SPEC-20260914-auth-login: seeds `admin` on an empty Users table; the
      # forced password change applies on first login regardless of this value.
      # Defaults to the documented seed password — an empty value would trip
      # ConfigurationValidator ("non-empty when set") and crash the container.
      Auth__AdminInitialPassword: ${AUTH_ADMIN_INITIAL_PASSWORD:-123qwe}
      # Default vault seed: on first boot, while no ObsidianVault source exists,
      # one is registered pointing at this path (the `vault` named volume).
      # Opt out: set VAULT_PATH= (empty) in .env — note the `-` (no colon)
      # interpolation: empty stays empty, only a missing var gets the default.
      Vault__Path: ${VAULT_PATH-/vaults/default}
      Vault__Name: ${VAULT_NAME:-Default Vault}
    # Lets the container reach services on the Docker host (e.g. local Ollama).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 8g
    memswap_limit: 8g
    # stdout/stderr rotation — the Serilog file sink already rotates (14d),
    # but container stdout would otherwise grow unbounded in json-file.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

# Host-global name keeps the vault stable regardless of the compose project
# directory; rename (or drop `name:` for a per-project <project>_vault volume)
# if you ever run a second KnowledgeHub stack on the same Docker host.
volumes:
  vault:
    name: vault
