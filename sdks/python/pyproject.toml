[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledgehub-sdk"
version = "0.1.0"
description = "Official client SDK for the Knowledge MCP Hub — typed facade over MCP with LangChain/LangGraph tool adapters"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Afonso Dutra Nogueira Filho" }]
requires-python = ">=3.10"
dependencies = [
    # mcp 2.x vendors the HTTP layer as the `httpx2` fork — we share the same
    # client object for MCP transport and REST SSE, so it must be httpx2.
    "mcp>=2.0",
    "httpx2>=2.13",
    "pydantic>=2",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anyio"]

[project.urls]
Homepage = "https://github.com/afonsoft/KnowledgeRAG"
Repository = "https://github.com/afonsoft/KnowledgeRAG"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledgehub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
