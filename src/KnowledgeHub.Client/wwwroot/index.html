<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowledge</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="_content/BootstrapBlazor/css/bootstrap.blazor.bundle.min.css" />
    <link rel="stylesheet" href="_content/BootstrapBlazor/css/motronic.min.css" />
    <link rel="stylesheet" href="_content/BootstrapBlazor.FontAwesome/css/font-awesome.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link href="KnowledgeHub.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        <span class="msg">Ocorreu um erro inesperado.</span>
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/BootstrapBlazor/js/bootstrap.blazor.bundle.min.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="js/boot.js"></script>
    <script>
        // i18n: restore persisted culture onto <html lang> + the error shell
        // before Blazor boots (Program.cs re-reads kh:culture into CultureInfo).
        (function () {
            var c = localStorage.getItem('kh:culture') || 'pt-BR';
            document.documentElement.lang = c;
            var m = {
                'pt-BR': ['Ocorreu um erro inesperado.', 'Recarregar'],
                'en': ['An unexpected error occurred.', 'Reload'],
                'es': ['Se produjo un error inesperado.', 'Recargar']
            }[c] || [];
            if (m.length) {
                var e = document.getElementById('blazor-error-ui');
                e.querySelector('.msg').textContent = m[0];
                e.querySelector('.reload').textContent = m[1];
            }
        })();
    </script>
    <script>
        // PWA (SPEC-20260918-ui-layout-polish): dev worker is a no-op;
        // the published worker precaches the app shell.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
        // SPEC-20260925-mcp-monitor-audit: client-side CSV download helper.
        window.khDownload = function (filename, text, mime) {
            const blob = new Blob([text], { type: mime || 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        };
    </script>
</body>

</html>
