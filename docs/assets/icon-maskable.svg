<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Knowledge MCP Hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#512BD4"/>
      <stop offset="0.55" stop-color="#6D3BE0"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E3FF"/>
    </linearGradient>
  </defs>

  <!-- maskable tile: full-bleed, no rounded corners (the mask crops it) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- content scaled to ~72% of canvas, centred → inside the maskable safe zone -->
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <!-- brain: symmetric top view, two hemispheres -->
    <g fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <!-- left hemisphere outline -->
      <path d="M 256 118
               C 208 118 172 138 160 172
               C 128 178 108 202 112 232
               C 92 246 88 276 106 294
               C 96 320 112 344 140 350
               C 142 376 168 394 198 390
               C 216 402 240 400 256 390
               L 256 118 Z"/>
      <!-- right hemisphere outline (mirrored) -->
      <path d="M 256 118
               C 304 118 340 138 352 172
               C 384 178 404 202 400 232
               C 420 246 424 276 406 294
               C 416 320 400 344 372 350
               C 370 376 344 394 314 390
               C 296 402 272 400 256 390
               L 256 118 Z"/>
      <!-- longitudinal fissure -->
      <path d="M 256 122 L 256 388" stroke-opacity="0.55" stroke-width="10" stroke-dasharray="2 20"/>
    </g>

    <!-- knowledge-graph network inside the brain -->
    <g stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="6" stroke-linecap="round">
      <line x1="176" y1="196" x2="216" y2="160"/>
      <line x1="176" y1="196" x2="150" y2="254"/>
      <line x1="176" y1="196" x2="232" y2="240"/>
      <line x1="150" y1="254" x2="196" y2="296"/>
      <line x1="232" y1="240" x2="196" y2="296"/>
      <line x1="196" y1="296" x2="170" y2="344"/>
      <line x1="196" y1="296" x2="228" y2="352"/>
      <line x1="336" y1="196" x2="296" y2="160"/>
      <line x1="336" y1="196" x2="362" y2="254"/>
      <line x1="336" y1="196" x2="280" y2="240"/>
      <line x1="362" y1="254" x2="316" y2="296"/>
      <line x1="280" y1="240" x2="316" y2="296"/>
      <line x1="316" y1="296" x2="342" y2="344"/>
      <line x1="316" y1="296" x2="284" y2="352"/>
      <line x1="232" y1="240" x2="280" y2="240" stroke-opacity="0.5"/>
      <line x1="228" y1="352" x2="284" y2="352" stroke-opacity="0.5"/>
    </g>
    <g fill="url(#node)">
      <circle cx="216" cy="160" r="14"/>
      <circle cx="176" cy="196" r="17"/>
      <circle cx="150" cy="254" r="14"/>
      <circle cx="232" cy="240" r="19"/>
      <circle cx="196" cy="296" r="14"/>
      <circle cx="170" cy="344" r="13"/>
      <circle cx="228" cy="352" r="15"/>
      <circle cx="296" cy="160" r="14"/>
      <circle cx="336" cy="196" r="17"/>
      <circle cx="362" cy="254" r="14"/>
      <circle cx="280" cy="240" r="19"/>
      <circle cx="316" cy="296" r="14"/>
      <circle cx="342" cy="344" r="13"/>
      <circle cx="284" cy="352" r="15"/>
    </g>
  </g>
</svg>
