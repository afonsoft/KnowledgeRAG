name: "KnowledgeHub CodeQL config"

# SPEC-20261002-static-analysis-residual (E27-S3, #505): build outputs and
# source-generated files (obj/**/generated, bin/) carry analyzer noise the
# repo cannot act on — scan real sources only.
paths-ignore:
  - "**/obj/**"
  - "**/bin/**"
  - "**/*.g.cs"
  - "**/Migrations/**"
  # Generated standalone diagram HTML (archify exports) — static artifacts.
  - "docs/architecture/**"
