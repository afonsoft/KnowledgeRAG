name: 🧩 SDK CI

# Continuous build+test for the client SDK libraries under sdks/.
on:
  push:
    branches: [main]
    paths: ['sdks/**', '.github/workflows/sdk-ci.yml']
  pull_request:
    paths: ['sdks/**', '.github/workflows/sdk-ci.yml']

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  PYTHON_VERSION: '3.12'
  JAVA_VERSION: '17'
  GO_VERSION: '1.27.x'

jobs:
  dotnet-sdk:
    name: 🔷 .NET SDK build + test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: 🗄️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔧 Build SDK
        run: dotnet build sdks/dotnet/KnowledgeHub.Sdk/KnowledgeHub.Sdk.csproj -c Release

      - name: 📦 Pack (dry-run)
        run: dotnet pack sdks/dotnet/KnowledgeHub.Sdk/KnowledgeHub.Sdk.csproj -c Release -o ./nupkgs

      - name: 🧪 SDK unit tests
        run: dotnet test tests/KnowledgeHub.Tests.Unit/KnowledgeHub.Tests.Unit.csproj --filter "FullyQualifiedName~Sdk"

  python-sdk:
    name: 🐍 Python SDK build + test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            sdks/python/pyproject.toml
            sdks/python/requirements-ci.txt

      - name: 📦 Install pinned toolchain
        working-directory: sdks/python
        run: pip install --only-binary ":all:" -r requirements-ci.txt

      - name: 🏗️ Build wheel
        working-directory: sdks/python
        run: python -m build --outdir ./dist

      - name: 📦 Install wheel + test
        working-directory: sdks/python
        run: |
          pip install --only-binary ":all:" ./dist/*.whl
          python -m pytest tests/ -q

  java-sdk:
    name: ☕ Java SDK build + test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: ☕ Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: 🔧 Build + test
        working-directory: sdks/java
        run: mvn -B verify

      - name: 📦 Upload jar (dry-run artifacts)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        with:
          name: knowledgehub-sdk-java-ci
          path: sdks/java/target/*.jar
          retention-days: 7

  go-sdk:
    name: 🐹 Go SDK build + test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: 🐹 Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16   # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sdks/go/go.sum

      - name: 🔧 Vet + build + test
        working-directory: sdks/go
        run: |
          go vet ./...
          go build ./...
          go test ./...
