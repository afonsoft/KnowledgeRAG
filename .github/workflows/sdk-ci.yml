name: 🧩 SDK CI

# Continuous build+test for the client SDK libraries under sdks/.
concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
    paths: ['sdks/**', '.github/workflows/sdk-ci.yml']
  pull_request:
    paths: ['sdks/**', '.github/workflows/sdk-ci.yml']

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  PYTHON_VERSION: '3.12'
  JAVA_VERSION: '17'
  GO_VERSION: '1.27.x'

jobs:
  dotnet-sdk:
    name: 🔷 .NET SDK build + test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: 🗄️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔧 Build SDK
        run: dotnet build sdks/dotnet/KnowledgeHub.Sdk/KnowledgeHub.Sdk.csproj -c Release

      - name: 📦 Pack (dry-run)
        run: dotnet pack sdks/dotnet/KnowledgeHub.Sdk/KnowledgeHub.Sdk.csproj -c Release -o ./nupkgs

      - name: 🧪 SDK unit tests
        run: dotnet test tests/KnowledgeHub.Tests.Unit/KnowledgeHub.Tests.Unit.csproj --filter "FullyQualifiedName~Sdk"

  python-sdk:
    name: 🐍 Python SDK build + test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            sdks/python/pyproject.toml
            sdks/python/requirements-ci.txt

      - name: 📦 Install pinned toolchain
        working-directory: sdks/python
        run: pip install --only-binary ":all:" -r requirements-ci.txt

      - name: 🏗️ Build wheel
        working-directory: sdks/python
        run: python -m build --outdir ./dist

      - name: 📦 Install wheel + test
        working-directory: sdks/python
        run: |
          pip install --only-binary ":all:" ./dist/*.whl
          python -m pytest tests/ -q

  java-sdk:
    name: ☕ Java SDK build + test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: ☕ Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: 🔧 Build + test
        working-directory: sdks/java
        run: mvn -B verify

      - name: 📦 Upload jar (dry-run artifacts)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        with:
          name: knowledgehub-sdk-java-ci
          path: sdks/java/target/*.jar
          retention-days: 7

  go-sdk:
    name: 🐹 Go SDK build + test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: 🐹 Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16   # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sdks/go/go.sum

      - name: 🔧 Vet + build + test
        working-directory: sdks/go
        run: |
          go vet ./...
          go build ./...
          go test ./...

  # Real MCP E2E: boots the hub (SQLite defaults, no LLM provider needed —
  # the live tests accept the clean provider-missing error paths) and runs
  # each SDK's env-gated live tests against it. Covers tools/list +
  # tools/call + typed facades + SSE error paths end to end.
  live-e2e:
    name: 🔌 Live E2E vs real hub (Java + Go)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: 🗄️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: ☕ Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: 🐹 Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16   # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sdks/go/go.sum

      - name: 🚀 Boot the hub
        run: |
          dotnet build src/KnowledgeHub.Server -c Release
          # launchSettings (port 5009) only applies to `dotnet run` — pin the URL.
          # The csproj bakes a RID into build output, so the host binary lives
          # under the linux-x64 folder, not directly in net10.0/.
          ASPNETCORE_URLS=http://localhost:5009 nohup ./src/KnowledgeHub.Server/bin/Release/net10.0/linux-x64/KnowledgeHub > /tmp/hub.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5009/health/live > /dev/null; then
              echo "hub up after ~$((i*2))s"; exit 0
            fi
            sleep 2
          done
          echo "::error::hub did not become healthy"; tail -50 /tmp/hub.log; exit 1

      # Fresh DB seeds admin with the documented first-boot password `123qwe`
      # and MustChangePassword gates every other endpoint — so the sequence is
      # login → change-password → mint key. `-c -b` on every call persists the
      # re-issued cookie (change-password rotates it).
      - name: 🔑 Mint test API key
        run: |
          curl -sf -c /tmp/jar -X POST http://localhost:5009/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"123qwe"}' > /dev/null
          curl -sf -b /tmp/jar -c /tmp/jar -X POST http://localhost:5009/api/auth/change-password \
            -H 'Content-Type: application/json' \
            -d '{"currentPassword":"123qwe","newPassword":"CiTest1234!"}' -o /dev/null
          KEY=$(curl -sf -b /tmp/jar -c /tmp/jar -X POST http://localhost:5009/api/apikeys \
            -H 'Content-Type: application/json' \
            -d '{"name":"sdk-ci-e2e"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          echo "::add-mask::$KEY"
          echo "KNOWLEDGEHUB_KEY=$KEY" >> $GITHUB_ENV
          echo "KNOWLEDGEHUB_URL=http://localhost:5009" >> $GITHUB_ENV

      - name: ☕ Java live E2E
        working-directory: sdks/java
        run: mvn -B test -Dtest=KnowledgeHubLiveTest

      - name: 🐹 Go live E2E
        working-directory: sdks/go
        run: go test -v -run 'TestLive_' ./...

      - name: 🛑 Stop the hub
        if: always()
        run: pkill -f 'linux-x64/KnowledgeHub' || true
