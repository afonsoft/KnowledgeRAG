name: 🔒 Security Scan

permissions: {}

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'    # Weekly on Monday at 2 AM UTC

jobs:
  codeql:
    name: 🔍 CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            # C# supports build-mode 'none': CodeQL extracts the code without
            # compiling — same analysis quality, saves the ~5min autobuild.
            build-mode: none
          - language: javascript
            build-mode: none

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: 📦 Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63   # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: 🔍 Perform Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63   # v4
        with:
          category: "/language:${{ matrix.language }}"

  snyk:
    name: 🛡️ Snyk Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      # Token check before the restore — without SNYK_TOKEN the whole job is
      # advisory anyway, so skip the ~40s restore+setup work.
      - name: 🔑 Check Snyk token
        id: snyk-token
        run: |
          if [ -n "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
            echo "::notice::SNYK_TOKEN não configurado — pulando Snyk"
          fi

      - name: 🗄️ Setup .NET
        if: steps.snyk-token.outputs.present == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: 🔧 Restore Dependencies
        if: steps.snyk-token.outputs.present == 'true'
        run: dotnet restore KnowledgeHub.slnx --ignore-failed-sources

      - name: 🛡️ Install Snyk CLI
        if: steps.snyk-token.outputs.present == 'true'
        run: |
          curl -s https://static.snyk.io/cli/latest/snyk-linux -o snyk
          chmod +x ./snyk
          sudo mv ./snyk /usr/local/bin/

      - name: 🛡️ Run Snyk Security Scan
        if: steps.snyk-token.outputs.present == 'true'
        run: snyk test --severity-threshold=high --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  trivy:
    name: 🔐 Trivy Container Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e   # v4.3.0

      # build-push-action + gha cache reuses the CI Build & Test image layers
      # (same Dockerfile/context) — a bare `docker build` re-did ~10min of work.
      - name: 🐳 Build image to scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a   # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: knowledgerag:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: 🔐 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          image-ref: 'knowledgerag:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 🔐 Upload Trivy Results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63   # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
