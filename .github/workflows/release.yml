name: 🚀 Release & Publish

permissions: {}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  validate-tag:
    name: 🏷️ Validate Version Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 🔍 Extract Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION (expected X.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

  build-release:
    name: 🏗️ Build Release Artifacts
    runs-on: ubuntu-latest
    needs: validate-tag
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: 🗄️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔧 Restore & Build
        run: |
          dotnet restore KnowledgeHub.slnx
          dotnet build KnowledgeHub.slnx --configuration Release --no-restore

      # Single-file props (PublishSingleFile, SelfContained,
      # IncludeNativeLibrariesForSelfExtract) live in the Server csproj —
      # passing them as -p: globals propagates to the WASM Client project and
      # fails with NETSDK1098. Keep only runtime/version/output here.
      - name: 📦 Publish Single-File (linux-x64)
        run: |
          dotnet publish src/KnowledgeHub.Server/KnowledgeHub.Server.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:Version=${{ needs.validate-tag.outputs.version }} \
            --output ./publish/linux-x64

      - name: 📦 Publish Single-File (win-x64)
        run: |
          dotnet publish src/KnowledgeHub.Server/KnowledgeHub.Server.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            -p:Version=${{ needs.validate-tag.outputs.version }} \
            --output ./publish/win-x64

      # Upload archives, not the raw publish dirs — hundreds of loose files
      # per RID both exceed the asset list a user wants AND burn through the
      # GitHub secondary rate limit during upload.
      - name: 🗜️ Package Archives
        run: |
          tar -C ./publish/linux-x64 -czf ./publish/knowledgehub-linux-x64.tar.gz .
          cd ./publish/win-x64 && zip -qr ../knowledgehub-win-x64.zip .

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        with:
          name: knowledgehub-${{ needs.validate-tag.outputs.version }}
          path: |
            ./publish/knowledgehub-linux-x64.tar.gz
            ./publish/knowledgehub-win-x64.zip
          retention-days: 30

  publish-docker:
    name: 🐳 Publish Docker Image
    runs-on: ubuntu-latest
    needs: [validate-tag, build-release]
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567   # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and Push Docker Image (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a   # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          load: true
          tags: |
            ghcr.io/afonsoft/knowledgerag:${{ needs.validate-tag.outputs.version }}
            ghcr.io/afonsoft/knowledgerag:latest

      # Docker Hub publica afonsoft/knowledgerag quando os secrets DOCKERHUB_*
      # existirem no repo — sem eles os steps abaixo são pulados.
      - name: 🔐 Log in to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567   # v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: 🐳 Push to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          VER="${{ needs.validate-tag.outputs.version }}"
          docker tag ghcr.io/afonsoft/knowledgerag:$VER "$DOCKERHUB_USERNAME/knowledgerag:$VER"
          docker tag ghcr.io/afonsoft/knowledgerag:$VER "$DOCKERHUB_USERNAME/knowledgerag:latest"
          docker push "$DOCKERHUB_USERNAME/knowledgerag:$VER"
          docker push "$DOCKERHUB_USERNAME/knowledgerag:latest"

  create-release:
    name: 📝 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-tag, build-release, publish-docker]
    permissions:
      contents: write
    steps:
      - name: 📤 Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: knowledgehub-${{ needs.validate-tag.outputs.version }}
          path: ./publish

      - name: 📝 Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64   # v3.0.3
        with:
          tag_name: v${{ needs.validate-tag.outputs.version }}
          name: Release v${{ needs.validate-tag.outputs.version }}
          body: |
            ## 🚀 KnowledgeHub v${{ needs.validate-tag.outputs.version }}

            ### Downloads
            - **Linux (x64):** knowledgehub-linux-x64
            - **Windows (x64):** knowledgehub-win-x64
            - **Docker:** ghcr.io/afonsoft/knowledgerag:${{ needs.validate-tag.outputs.version }}

            ### Changes
            Automated release from tag v${{ needs.validate-tag.outputs.version }}
          files: |
            ./publish/knowledgehub-linux-x64.tar.gz
            ./publish/knowledgehub-win-x64.zip
          draft: false
          prerelease: false
