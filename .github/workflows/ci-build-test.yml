name: 🚀 CI Build & Test

permissions: {}

# Pushes stack up duplicate full runs on the same ref — cancel superseded
# ones (main always runs to completion so post-merge signal is never lost).
concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches:
      - "main"
      - "feature/*"
      - "bug/*"
      - "hotfix/*"
  pull_request:
    branches:
      - "main"
    # 'closed' was a full duplicate run on every merge — the main push already
    # triggers this workflow, so it only burned minutes.
    types: [opened, synchronize, reopened]

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION: "KnowledgeHub.slnx"

jobs:
  build-knowledgerag:
    name: Build KnowledgeHub (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION }} --verbosity normal

      # SPEC-20261002-ci-coverage-ratchet-pin RF-003: the format gate documented
      # in CLAUDE.md must actually run — it drifted (47 whitespace findings on
      # main) while no workflow enforced it.
      - name: Format Gate
        run: dotnet format ${{ env.SOLUTION }} --no-restore --verify-no-changes --verbosity minimal

      - name: Build Solution
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release --verbosity minimal

  test-unit:
    name: Unit Tests (xUnit)
    runs-on: ubuntu-latest
    needs: build-knowledgerag
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run Unit Tests
        run: dotnet test tests/KnowledgeHub.Tests.Unit/KnowledgeHub.Tests.Unit.csproj --configuration Release --verbosity minimal --logger "trx;LogFileName=unit-tests.trx" --collect:"XPlat Code Coverage"

      # SPEC-20260928-test-reliability-and-coverage-gate RF-002 +
      # SPEC-20260929-observability-and-tests-residual RF-004: the floor lives
      # in the COVERAGE_BASELINE repository variable — the coverage-ratchet
      # job raises it via API when main improves (main is PR-required, so a
      # committed-file bump can't be pushed; bot-authored PRs would never
      # satisfy required checks). .ci/coverage-baseline.txt is the bootstrap
      # fallback only.
      - name: Coverage Gate
        run: |
          XML=$(ls -t tests/KnowledgeHub.Tests.Unit/TestResults/*/coverage.cobertura.xml 2>/dev/null | head -1)
          if [ -z "$XML" ]; then echo "::error::coverage.cobertura.xml not found"; exit 1; fi
          RATE=$(python3 -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('$XML').getroot().get('line-rate'))*100, 2))")
          BASELINE="${{ vars.COVERAGE_BASELINE }}"
          BASELINE=${BASELINE:-$(cat .ci/coverage-baseline.txt 2>/dev/null || echo "20")}
          echo "Line coverage: ${RATE}% (baseline ${BASELINE}%)"
          if python3 -c "import sys; sys.exit(0 if float('$RATE') >= float('$BASELINE') else 1)"; then
            echo "Coverage gate passed."
          else
            echo "::error::Coverage ${RATE}% < baseline ${BASELINE}%"; exit 1
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        if: always()
        with:
          name: unit-test-results
          path: "**/unit-tests.trx"
          if-no-files-found: ignore

      - name: Upload Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        if: always()
        with:
          name: unit-coverage-xml
          path: "**/coverage.cobertura.xml"
          if-no-files-found: ignore

  test-integration:
    name: Integration Tests (SQLite)
    runs-on: ubuntu-latest
    needs: build-knowledgerag
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run Integration Tests
        run: dotnet test tests/KnowledgeHub.Tests.Integration/KnowledgeHub.Tests.Integration.csproj --configuration Release --verbosity minimal --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        if: always()
        with:
          name: integration-test-results
          path: "**/integration-tests.trx"
          if-no-files-found: ignore

  test-performance:
    name: Performance Tests (load)
    runs-on: ubuntu-latest
    needs: build-knowledgerag
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run Performance Tests
        run: dotnet test tests/KnowledgeHub.Tests.Performance/KnowledgeHub.Tests.Performance.csproj --configuration Release --verbosity normal --logger "trx;LogFileName=performance-tests.trx"

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        if: always()
        with:
          name: performance-test-results
          path: "**/performance-tests.trx"
          if-no-files-found: ignore

  blazor-client-validation:
    name: Blazor WASM Client Validation
    runs-on: ubuntu-latest
    needs: build-knowledgerag
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build Blazor WASM Client
        run: dotnet build src/KnowledgeHub.Client/KnowledgeHub.Client.csproj --configuration Release --verbosity minimal

      - name: Validate WASM Assets
        run: |
          # Client is a Razor class library hosted by the Server. A plain `build`
          # emits the fingerprinted app payload into _framework/ (blazor.boot.json
          # only appears on `publish`), while index.html stays in the source
          # wwwroot and is served by the Server host.
          fw="src/KnowledgeHub.Client/bin/Release/net10.0/wwwroot/_framework"
          app_wasm=$(ls "$fw"/KnowledgeHub.Client.*.wasm 2>/dev/null | head -1)
          if [ -z "$app_wasm" ]; then
            echo "::error::WASM do app nao gerado em $fw (KnowledgeHub.Client.*.wasm)"
            exit 1
          fi
          if [ ! -f "src/KnowledgeHub.Client/wwwroot/index.html" ]; then
            echo "::error::wwwroot/index.html ausente no projeto Client"
            exit 1
          fi
          echo "Blazor WASM assets gerados com sucesso: $(basename "$app_wasm")"
          echo "payloads em _framework: $(ls "$fw" | wc -l)"

  test-ui:
    name: UI Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-knowledgerag
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build UI Test Project
        run: dotnet build tests/KnowledgeHub.Tests.Ui/KnowledgeHub.Tests.Ui.csproj --configuration Release --verbosity minimal

      - name: Install Playwright Browsers
        run: pwsh tests/KnowledgeHub.Tests.Ui/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run UI Tests
        run: dotnet test tests/KnowledgeHub.Tests.Ui/KnowledgeHub.Tests.Ui.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=ui-tests.trx"

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        if: always()
        with:
          name: ui-test-results
          path: "**/ui-tests.trx"
          if-no-files-found: ignore

      - name: Upload UI Screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        if: always()
        with:
          name: ui-screenshots
          path: "**/ui-screenshots/"
          if-no-files-found: ignore

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: build-knowledgerag
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e   # v4.3.0

      - name: Build Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a   # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: knowledgerag:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # SPEC-20260929-observability-and-tests-residual RF-004: after a main push,
  # raise .ci/coverage-baseline.txt to the measured rate when it improved.
  # The gate on PRs then enforces "no regression vs main" automatically —
  # the baseline is a ratchet, never lowered by CI.
  coverage-ratchet:
    name: Coverage Baseline Ratchet
    runs-on: ubuntu-latest
    needs: test-unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Download Coverage Report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: unit-coverage-xml

      # Baseline lives in the COVERAGE_BASELINE repository variable.
      # GITHUB_TOKEN can't write Actions variables (403) — when the API write is
      # denied we surface the raise via a tracking issue instead of failing, so
      # main stays green and the bump is a one-click manual step.
      - name: Raise Baseline When Improved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          XML=$(find . -name "coverage.cobertura.xml" | head -1)
          if [ -z "$XML" ]; then echo "coverage xml not found — skipping ratchet"; exit 0; fi
          RATE=$(python3 -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('$XML').getroot().get('line-rate'))*100, 2))")
          BASELINE="${{ vars.COVERAGE_BASELINE }}"
          BASELINE=${BASELINE:-$(cat .ci/coverage-baseline.txt 2>/dev/null || echo "0")}
          echo "measured ${RATE}% vs baseline ${BASELINE}%"
          if python3 -c "import sys; sys.exit(0 if float('$RATE') > float('$BASELINE') else 1)"; then
            if gh api "repos/${GITHUB_REPOSITORY}/actions/variables/COVERAGE_BASELINE" -X PATCH -f value="$RATE" 2>/dev/null \
              || gh api "repos/${GITHUB_REPOSITORY}/actions/variables" -X POST -f name=COVERAGE_BASELINE -f value="$RATE" 2>/dev/null; then
              echo "::notice::coverage baseline raised ${BASELINE}% -> ${RATE}%"
            else
              echo "::warning::coverage improved ${BASELINE}% -> ${RATE}% but GITHUB_TOKEN cannot write repo variables — opening tracking issue"
              BODY="Measured coverage on main is **${RATE}%** (baseline ${BASELINE}%). Update the \`COVERAGE_BASELINE\` repository variable in Settings → Secrets and variables → Actions → Variables, then close this issue."
              OPEN_ISSUE=$(gh issue list --state open --search "in:title coverage baseline raise" --json number --jq '.[0].number')
              if [ -n "$OPEN_ISSUE" ]; then
                gh issue comment "$OPEN_ISSUE" --body "$BODY"
              else
                gh issue create --title "chore: coverage baseline raise needed" --body "$BODY"
              fi
            fi
          else
            echo "coverage did not improve — baseline unchanged"
          fi
