name: 🚀 CI Build & Test

permissions: {}

on:
  push:
    branches:
      - "main"
      - "feature/*"
      - "bug/*"
      - "hotfix/*"
  pull_request:
    branches:
      - "main"
    types: [opened, synchronize, reopened, closed]

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION: "KnowledgeHub.slnx"

jobs:
  build-knowledgehub:
    name: Build KnowledgeHub (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION }} --verbosity normal

      - name: Build Solution
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release --verbosity minimal

  test-unit:
    name: Unit Tests (xUnit)
    runs-on: ubuntu-latest
    needs: build-knowledgehub
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Unit Tests
        run: dotnet test tests/KnowledgeHub.Tests.Unit/KnowledgeHub.Tests.Unit.csproj --configuration Release --verbosity minimal --logger "trx;LogFileName=unit-tests.trx" --collect:"XPlat Code Coverage"

      # SPEC-20260928-test-reliability-and-coverage-gate RF-002: enforce the
      # floor instead of collecting passively. Ratchet — never lower COVERAGE_MIN;
      # raise it when coverage improves. Measured 2026-09-29: 20.6% (Blazor WASM
      # client pulls the aggregate down; server projects are ~21–64%).
      - name: Coverage Gate
        env:
          COVERAGE_MIN: "20"
        run: |
          XML=$(ls -t tests/KnowledgeHub.Tests.Unit/TestResults/*/coverage.cobertura.xml 2>/dev/null | head -1)
          if [ -z "$XML" ]; then echo "::error::coverage.cobertura.xml not found"; exit 1; fi
          RATE=$(python3 -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('$XML').getroot().get('line-rate'))*100, 2))")
          echo "Line coverage: ${RATE}% (min ${COVERAGE_MIN}%)"
          if python3 -c "import sys; sys.exit(0 if float('$RATE') >= float('$COVERAGE_MIN') else 1)"; then
            echo "Coverage gate passed."
          else
            echo "::error::Coverage ${RATE}% < ${COVERAGE_MIN}%"; exit 1
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        if: always()
        with:
          name: unit-test-results
          path: "**/unit-tests.trx"
          if-no-files-found: ignore

  test-integration:
    name: Integration Tests (SQLite)
    runs-on: ubuntu-latest
    needs: build-knowledgehub
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Integration Tests
        run: dotnet test tests/KnowledgeHub.Tests.Integration/KnowledgeHub.Tests.Integration.csproj --configuration Release --verbosity minimal --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        if: always()
        with:
          name: integration-test-results
          path: "**/integration-tests.trx"
          if-no-files-found: ignore

  blazor-client-validation:
    name: Blazor WASM Client Validation
    runs-on: ubuntu-latest
    needs: build-knowledgehub
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Blazor WASM Client
        run: dotnet build src/KnowledgeHub.Client/KnowledgeHub.Client.csproj --configuration Release --verbosity minimal

      - name: Validate WASM Assets
        run: |
          # Client is a Razor class library hosted by the Server. A plain `build`
          # emits the fingerprinted app payload into _framework/ (blazor.boot.json
          # only appears on `publish`), while index.html stays in the source
          # wwwroot and is served by the Server host.
          fw="src/KnowledgeHub.Client/bin/Release/net10.0/wwwroot/_framework"
          app_wasm=$(ls "$fw"/KnowledgeHub.Client.*.wasm 2>/dev/null | head -1)
          if [ -z "$app_wasm" ]; then
            echo "::error::WASM do app nao gerado em $fw (KnowledgeHub.Client.*.wasm)"
            exit 1
          fi
          if [ ! -f "src/KnowledgeHub.Client/wwwroot/index.html" ]; then
            echo "::error::wwwroot/index.html ausente no projeto Client"
            exit 1
          fi
          echo "Blazor WASM assets gerados com sucesso: $(basename "$app_wasm")"
          echo "payloads em _framework: $(ls "$fw" | wc -l)"

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: build-knowledgehub
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e   # v4.3.0

      - name: Build Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a   # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: knowledgehub:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
