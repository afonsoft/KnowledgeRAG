name: 🧩 SDK Release & Publish

# Publishes the client SDKs on tags `sdk-v*.*.*` (e.g. `git tag sdk-v0.1.0`).
# NuGet push runs only when NUGET_API_KEY exists; PyPI push only when
# PYPI_API_TOKEN exists — same opt-in pattern as DOCKERHUB_* in release.yml.
# Java jars and the Go module source are always uploaded as artifacts
# (Maven Central publish needs its own secrets — see sdks/README.md;
# the Go module is consumed directly from git tags `sdks/go/v*.*.*`).
on:
  push:
    tags:
      - 'sdk-v*.*.*'

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  PYTHON_VERSION: '3.12'
  JAVA_VERSION: '17'
  GO_VERSION: '1.27.x'

jobs:
  validate-tag:
    name: 🏷️ Validate Version Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 🔍 Extract Version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/sdk-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

  publish-dotnet:
    name: 🔷 Publish KnowledgeHub.Sdk → NuGet
    runs-on: ubuntu-latest
    needs: [validate-tag]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: 🗄️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Pack
        run: |
          dotnet pack sdks/dotnet/KnowledgeHub.Sdk/KnowledgeHub.Sdk.csproj \
            -c Release -o ./nupkgs \
            /p:Version=${{ needs.validate-tag.outputs.version }}

      - name: 📤 Push to NuGet (optional — needs NUGET_API_KEY secret)
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: 📤 Upload Package Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        with:
          name: knowledgehub-sdk-dotnet-${{ needs.validate-tag.outputs.version }}
          path: ./nupkgs
          retention-days: 30

  publish-python:
    name: 🐍 Publish knowledgehub-sdk → PyPI
    runs-on: ubuntu-latest
    needs: [validate-tag]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install pinned toolchain
        working-directory: sdks/python
        run: pip install --only-binary ":all:" -r requirements-ci.txt

      - name: 🏷️ Set version + build sdist/wheel
        working-directory: sdks/python
        run: |
          sed -i 's/^version = ".*"/version = "${{ needs.validate-tag.outputs.version }}"/' pyproject.toml
          python -m build --outdir ./dist

      - name: 📤 Push to PyPI (optional — needs PYPI_API_TOKEN secret)
        if: env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: sdks/python
        run: twine upload ./dist/* -u __token__ -p "$PYPI_API_TOKEN" --skip-existing

      - name: 📤 Upload Package Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        with:
          name: knowledgehub-sdk-python-${{ needs.validate-tag.outputs.version }}
          path: sdks/python/dist
          retention-days: 30

  publish-java:
    name: ☕ Build knowledgehub-sdk jar
    runs-on: ubuntu-latest
    needs: [validate-tag]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: ☕ Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: 🏷️ Set version + package
        working-directory: sdks/java
        run: |
          mvn -B versions:set -DnewVersion=${{ needs.validate-tag.outputs.version }} -DgenerateBackupPoms=false
          mvn -B verify

      - name: 📤 Upload Package Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        with:
          name: knowledgehub-sdk-java-${{ needs.validate-tag.outputs.version }}
          path: sdks/java/target/*.jar
          retention-days: 30

  verify-go:
    name: 🐹 Verify Go module (consumed via git tags)
    runs-on: ubuntu-latest
    needs: [validate-tag]
    permissions:
      contents: write   # pushes the sdks/go/v*.*.* module tag
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: 🐹 Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16   # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sdks/go/go.sum

      - name: 🔧 Vet + build + test
        working-directory: sdks/go
        run: |
          go vet ./...
          go build ./...
          go test ./...

      - name: 🏷️ Tag Go module version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "sdks/go/v${{ needs.validate-tag.outputs.version }}" || true
          git push origin "sdks/go/v${{ needs.validate-tag.outputs.version }}" || true
