name: 📊 Code Quality

permissions: {}

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "releases/*"

jobs:
  qodana:
    name: 🔍 Qodana Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 🔍 Qodana Scan
        id: qodana
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692   # v2026.2.0
        continue-on-error: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: "--baseline,qodana.sarif.json,--fail-threshold,0"
          cache-default-branch-only: true
          upload-result: false

      - name: 📊 Upload Qodana Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        if: always()
        with:
          name: qodana-report
          path: ${{ github.workspace }}/qodana
          if-no-files-found: ignore

      - name: 📋 Qodana Summary
        if: always()
        run: |
          echo "## 🔍 Qodana Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.qodana.outcome }}" == "success" ]; then
            echo "✅ **Qodana scan completed successfully**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.qodana.outcome }}" == "failure" ]; then
            echo "❌ **Qodana scan failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔧 Possíveis causas:" >> $GITHUB_STEP_SUMMARY
            echo "- Token QODANA_TOKEN não configurado" >> $GITHUB_STEP_SUMMARY
            echo "- Baseline de qualidade excedido" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Qodana scan skipped**" >> $GITHUB_STEP_SUMMARY
          fi

  sonarqube:
    name: 📊 SonarQube Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0

      - name: 🔑 Check Sonar token
        id: sonar-token
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
            echo "::notice::SONAR_TOKEN não configurado — pulando análise SonarQube"
          fi

      - name: 🗄️ Setup .NET
        if: steps.sonar-token.outputs.present == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: ☕ Set up JDK 17
        if: steps.sonar-token.outputs.present == 'true'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00   # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Install SonarScanner
        if: steps.sonar-token.outputs.present == 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: 📊 SonarQube Scan
        if: steps.sonar-token.outputs.present == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # EF migrations are dotnet-ef scaffold output — boilerplate deltas
          # between providers look like duplication to the quality gate.
          dotnet sonarscanner begin \
            /k:"afonsoft_LangGraph-UI" \
            /o:"afonsoft" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cpd.exclusions="**/Migrations/**" \
            /d:sonar.exclusions="docs/architecture/**/*.html"
          dotnet build KnowledgeHub.slnx --configuration Release
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
